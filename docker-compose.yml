services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - social-mas

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - social-mas

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - social-mas

  orchestrator:
    build:
      context: ./src/orchestrator
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
      API_HOST: 0.0.0.0
      API_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
    ports:
      - "8000:8000"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      llm-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - social-mas

  collector-agent:
    build:
      context: ./src/go-agent
    environment:
      AGENT_CONFIG_PATH: /app/configs/collector.json
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      HEALTH_ADDR: :8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - social-mas

  sentiment-agent:
    build:
      context: ./src/go-agent
    environment:
      AGENT_CONFIG_PATH: /app/configs/sentiment.json
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      HEALTH_ADDR: :8082
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - social-mas

  trends-agent:
    build:
      context: ./src/go-agent
    environment:
      AGENT_CONFIG_PATH: /app/configs/trends.json
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      HEALTH_ADDR: :8083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - social-mas

  llm-agent:
    build:
      context: ./src/llm-agent
    environment:
      NATS_URL: nats://nats:4222
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      CLOUD_LLM_API_URL: ${CLOUD_LLM_API_URL:-}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      HEALTH_ADDR: 0.0.0.0
      HEALTH_PORT: 8090
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - social-mas

  reports-agent:
    build:
      context: ./src/go-agent
    environment:
      AGENT_CONFIG_PATH: /app/configs/reports.json
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      HEALTH_ADDR: :8084
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - social-mas

networks:
  social-mas:
    driver: bridge

volumes:
  redis-data:
